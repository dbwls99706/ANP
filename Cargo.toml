[workspace]
members = [
    "crates/anp-core",
    "crates/anp-nodes",
    "crates/anp-planner",
    "crates/anp-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
dashmap = "6"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["json"] }
flate2 = "1"
anp-core = { path = "crates/anp-core" }
anp-nodes = { path = "crates/anp-nodes" }
anp-planner = { path = "crates/anp-planner" }
